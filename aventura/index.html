<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aventura Digital · Luma</title><link rel="stylesheet" href="../shared/base.css"><style>
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
.found{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.found span{aspect-ratio:1;border-radius:50%;border:2px dashed #c6d4bb;display:grid;place-items:center;overflow:hidden}.found img{width:100%;height:100%;object-fit:cover;border-radius:50%;animation:pop .35s}
@keyframes pop{from{transform:scale(.3)}}
.kid{display:flex;gap:10px;align-items:center;margin-bottom:8px}.kid img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid var(--c);background:#fff}.kid b{display:block;font:600 16px Outfit}
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#244f3dee;color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;display:flex;gap:10px;align-items:center;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}.toast img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#fff}
.dpad{display:none;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:10px}.dpad button{height:56px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px}
@media (pointer:coarse){.dpad{display:grid}}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
</style><body><main id="app">
<section id="setup" class="panel"><small>ELEGÍ TU NIÑO ELEGIDO</small><h2>¿Quién explora el Mundo Digital?</h2><div id="pick" class="picker"></div><button id="start" class="btn primary">🧭 Empezar la aventura</button></section>
<section id="game" hidden><div class="layout"><div class="wrap"><canvas id="c" class="game" width="960" height="600"></canvas><div class="toast" id="toast"><img alt=""><span></span></div><div class="overlay" id="overlay" hidden><div><h2>✦ ¡Digidex completo!</h2><p id="ov-text"></p><button id="again" class="btn primary">Otra aventura</button></div></div></div>
<aside class="card"><div class="kid" id="kid"><img alt=""><div><small>NIÑO ELEGIDO</small><b></b></div></div><div class="stats" style="margin:0 0 8px;padding:10px 12px;gap:16px"><div><small>ENCONTRADOS</small><b id="count">0 / 20</b></div><div><small>TIEMPO</small><b id="time">0:00</b></div></div><small>DIGIDEX DE LA AVENTURA</small><div class="found" id="found"></div><p style="font-size:12px;color:#5a6c5c;line-height:1.5;margin-top:12px">Caminá con las flechas o <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span>. Tocá a cada Digimon para sumarlo. Tu compañero te sigue a todos lados.</p><div id="best" style="font-size:12px;color:#7a8a7c"></div></aside></div>
<div class="dpad"><span></span><button data-k="ArrowUp">▲</button><span></span><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div></section>
</main><script type="module" src="game.js"></script></body></html>
