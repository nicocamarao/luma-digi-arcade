<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tateti 4x4 · Luma</title><link rel="stylesheet" href="../shared/base.css"><style>
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}.cpu{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#cfdcc5;padding:12px;border-radius:18px;border:1px solid #c6d4bb;max-width:520px;margin:auto}
.cell{aspect-ratio:1;border-radius:14px;border:1px solid #d2dec9;background:#f8faf3;display:grid;place-items:center;padding:8%;transition:.15s}
.cell:hover:not(:disabled){background:#fff;transform:translateY(-2px)}
.cell img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--c);background:#fff;animation:pop .3s}
.cell.win{background:#d3e8bf;box-shadow:0 0 0 3px #7b9e5c}
@keyframes pop{from{transform:scale(.4)}}
.who{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;margin-bottom:8px;border:2px solid transparent}.who img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:3px solid var(--c);background:#fff}.who.active{border-color:var(--c);background:#fff}
.who b{display:block;font:600 16px Outfit}.who .wins{font:700 22px Outfit;margin-left:auto;color:#244f3d}
@media (max-width:820px){.layout,.teams{grid-template-columns:1fr}}
</style><body><main id="app">
<section id="setup" class="panel"><small>ELEGÍ LAS FICHAS</small><h2>Tres en línea en un tablero de 4×4</h2><div class="teams"><div class="card"><small>JUGADOR 1</small><div id="pick1" class="picker"></div></div><div class="card"><small>JUGADOR 2</small><div id="pick2" class="picker"></div><label class="cpu"><input type="checkbox" id="cpu"> El jugador 2 es la computadora</label></div></div><button id="start" class="btn primary">✕○ Empezar</button></section>
<section id="game" hidden><div class="layout"><div class="grid" id="grid"></div><aside class="card"><div class="who" id="who1"><img alt=""><div><small>JUGADOR 1</small><b></b></div><span class="wins">0</span></div><div class="who" id="who2"><img alt=""><div><small>JUGADOR 2</small><b></b></div><span class="wins">0</span></div><div class="message" id="message"></div><div style="display:flex;gap:8px;margin-top:10px"><button id="again" class="btn primary">↻ Otra ronda</button><button id="menu" class="btn">Cambiar</button></div><p style="font-size:12px;color:#5a6c5c;line-height:1.5;margin-top:12px">Valen filas, columnas y diagonales de 3 seguidas, en cualquier parte del tablero de 4×4.</p></aside></div></section>
</main><script type="module" src="game.js"></script></body></html>
